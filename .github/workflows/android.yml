name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7  # اینجا دقیقاً نسخه مورد نیاز را مشخص کردیم

    - name: Build with Gradle
      run: |
        # چون فایل gradlew نداریم، از نسخه نصب شده توسط Action استفاده می‌کنیم
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HSE-AI-PRO-Debug-APK
        path: |
          **/app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
