name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./HSE_AI_PRO_v4.4_GitHubBuildReady/gradlew" ]; then
          cd HSE_AI_PRO_v4.4_GitHubBuildReady && ./gradlew assembleDebug
        else
          find . -name "gradlew" -execdir ./gradlew assembleDebug \;
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HSE-AI-PRO-Debug-APK
        # این خط بسیار مهم است: با استفاده از ** در تمام پوشه‌ها به دنبال APK می‌گردد
        path: |
          **/build/outputs/apk/debug/*.apk
