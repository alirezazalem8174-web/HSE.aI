name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # تغییر اصلی در اینجا است: ورود به پوشه پروژه
    - name: Change directory to project folder
      run: cd HSE_AI_PRO_v4.4_GitHubBuildReady && chmod +x gradlew

    - name: Build with Gradle
      working-directory: HSE_AI_PRO_v4.4_GitHubBuildReady
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HSE-AI-PRO-Debug-APK
        path: HSE_AI_PRO_v4.4_GitHubBuildReady/app/build/outputs/apk/debug/app-debug.apk
