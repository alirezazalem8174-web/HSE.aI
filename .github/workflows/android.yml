name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, installing gradle via apt..."
          sudo apt-get update
          sudo apt-get install -y gradle
        fi

    - name: Build with Gradle
      run: |
        if [ -f "gradlew" ]; then
          echo "Using local gradlew..."
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Using system gradle..."
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HSE-AI-PRO-Debug-APK
        path: |
          **/app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
